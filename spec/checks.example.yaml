# Example ruleset entries for comfyguard.
#
# This shows the machine-readable format that the full catalog in docs/CHECKS.md
# compiles to. Each entry is one check. The engine loads these, runs the named
# detector against the collected Facts, and emits Findings using the shared
# schema in docs/REPORTING.md. The full ruleset carries one entry per check ID.
#
# Fields:
#   id            stable check ID (matches docs/CHECKS.md)
#   title         short human title
#   category      finding category
#   severity      default CVSS 4.0 band; may be raised/lowered by the detector
#   confidence    default confidence
#   urgency       blocker | urgent | standard | hardening (triage for deployed instances)
#   decision_owner  optional: "human" when resolving it is inherently an operator call
#   remediation   class + gate the agent plan must honor
#   detector      which collector Facts to read and how to match
#   references    citations attached to every finding from this check

ruleset_version: "2026.08.1"

checks:
  - id: EXP-002
    title: ComfyUI reachable with no authenticating layer
    category: exposure
    severity: critical
    confidence: high
    remediation:
      class: config
      gate: review-required
    detector:
      collector: network
      requires_authorization: true
      logic: >
        system_stats_status == 200 AND no_auth_challenge AND
        not proxy_auth_signature_present
    references:
      - type: policy
        url: https://github.com/comfyanonymous/ComfyUI/blob/master/SECURITY.md
      - type: incident
        url: https://thehackernews.com/2026/04/over-1000-exposed-comfyui-instances.html

  - id: EXP-003
    title: Permissive CORS disables the built-in Origin check
    category: exposure
    severity: high
    confidence: high
    remediation:
      class: config
      gate: review-required
    detector:
      collector: [install, network]
      logic: >
        flag_present("--enable-cors-header") OR
        response_header("Access-Control-Allow-Origin") == "*"
    references:
      - type: source
        url: https://raw.githubusercontent.com/comfyanonymous/ComfyUI/master/server.py

  - id: PATCH-002
    title: Core vulnerable to LoadTrainingDataset pickle RCE
    category: known-vulnerable-version
    severity: critical
    confidence: high
    remediation:
      class: upgrade
      gate: review-required
    detector:
      collector: [install, node]
      logic: >
        version_lt(core, fixed_commit="94ee49b") AND
        node_class_present("LoadTrainingDataset")
      version_resolution: [package_metadata, git_commit, source_probe]
    references:
      - type: advisory
        id: CVE-2026-68771
        url: https://www.vulncheck.com/advisories/comfyui-unauthenticated-rce-via-loadtrainingdataset-pickle-deserialization
      - type: fix
        url: https://github.com/Comfy-Org/ComfyUI/pull/14543

  - id: PATCH-007
    title: Known-malicious artifact present (IOC match)
    category: known-vulnerable-version
    severity: critical
    confidence: high
    remediation:
      class: quarantine
      gate: review-required
    detector:
      collector: [node, dependency, host]
      logic: match_ioc(ioc_feed)
      ioc_examples:
        node_dirs: ["ComfyUI_LLMVISION", "upscaler-4k", "lonemilk-upscalernew-4k", "ComfyUI-Upscaler-4K"]
        pip_pins: ["ultralytics==8.3.41", "ultralytics==8.3.42", "ultralytics==8.3.45", "ultralytics==8.3.46"]
    references:
      - type: incident
        url: https://blog.comfy.org/p/upscaler-4k-malicious-node-pack-post

  - id: NODE-003
    title: Custom node installs a package at runtime
    category: custom-node-code
    severity: high
    confidence: high
    remediation:
      class: manual
      gate: review-required
    detector:
      collector: node
      method: ast
      logic: >
        call_matches(["subprocess.*", "pip.main", "ensure_package", "install_requirements"])
        AND argument_contains("pip", "install")
      escalate_if: at_import_time
    references:
      - type: policy
        url: https://docs.comfy.org/registry/standards

  - id: NODE-007
    title: Custom node reads credential or wallet locations
    category: custom-node-code
    severity: critical
    confidence: medium
    remediation:
      class: quarantine
      gate: review-required
    detector:
      collector: node
      method: ast
      logic: >
        path_read_matches([
          "~/.ssh", "~/.aws", "*/Login Data", "*/wallet.dat",
          "*/Local Storage/leveldb", "keyring"
        ]) OR bulk_environ_dump()
      escalate_if: co_occurs_with(["NODE-006", "NODE-008", "NODE-009"])
    references:
      - type: incident
        url: https://www.vpnmentor.com/news/comfyui-malicious-custom-node/

  - id: MODEL-002
    title: Checkpoint contains a dangerous pickle import
    category: model-file
    severity: critical
    confidence: high
    remediation:
      class: quarantine
      gate: review-required
    detector:
      collector: model
      method: pickle-opcode-allowlist
      logic: >
        opcode_scan_without_deserialization AND
        references_global_outside_allowlist([
          "os", "sys", "subprocess", "builtins", "posix", "eval", "exec"
        ])
      content_sniff: true   # classify by magic bytes, not extension
    references:
      - type: issue
        url: https://github.com/Comfy-Org/ComfyUI/issues/12245
      - type: tool
        url: https://github.com/trailofbits/fickling

  - id: HOST-007
    title: Manager install flags enabled on a networked instance
    category: host
    severity: high
    confidence: high
    remediation:
      class: config
      gate: review-required
    detector:
      collector: [manager, install]
      logic: >
        networked AND (
          config("security_level") in ["weak", "normal-"] OR
          config("allow_pip_install") == true OR
          config("allow_git_url_install") == true
        )
    references:
      - type: docs
        url: https://docs.comfy.org/manager/configuration

  - id: EXP-007
    title: No Content-Security-Policy on an exposed instance
    category: exposure
    severity: medium
    confidence: medium
    remediation:
      class: config
      gate: review-required
    detector:
      collector: [install, network]
      logic: >
        networked AND not flag_present("--disable-api-nodes")
        AND not response_header("Content-Security-Policy")
      note: ComfyUI emits its CSP only when --disable-api-nodes is set; recommend it or inject CSP at the proxy.
    references:
      - type: source
        url: https://raw.githubusercontent.com/comfyanonymous/ComfyUI/master/server.py

  - id: HOST-010
    title: ComfyUI-Manager config on the legacy web-reachable path
    category: host
    severity: high
    confidence: high
    remediation:
      class: upgrade
      gate: review-required
    detector:
      collector: [manager]
      logic: config_path_is_legacy == true   # user/default/ComfyUI-Manager/ (pre-__manager migration)
      cross_ref: [PATCH-003]
    references:
      - type: advisory
        id: CVE-2025-67303
        url: https://xlab.tencent.com/en/2026/01/06/xlab-26-001/

  # ---- Deployment / production families (examples) ----

  - id: API-008
    title: WebSocket /ws reachable unauthenticated
    category: api
    severity: high
    confidence: high
    urgency: blocker
    remediation:
      class: config
      gate: review-required
    detector:
      collector: network
      requires_authorization: true
      logic: >
        ws_connect("/ws") succeeds without auth
        AND receives status/preview broadcasts
      note: Non-browser clients bypass the origin-only middleware; it is CSRF defense, not auth.
    references:
      - type: source
        url: https://raw.githubusercontent.com/comfyanonymous/ComfyUI/master/server.py

  - id: DOS-001
    title: No rate limiting in front of /prompt
    category: availability
    severity: high
    confidence: medium
    urgency: urgent
    decision_owner: human
    remediation:
      class: config
      gate: review-required
    detector:
      collector: [install, network]
      logic: networked AND not proxy_rate_limit_detected
      note: Core has no throttling; the pending queue is unbounded.
    references:
      - type: policy
        url: https://raw.githubusercontent.com/comfyanonymous/ComfyUI/master/SECURITY.md

  - id: GW-003
    title: WebSocket not behind the proxy auth
    category: gateway
    severity: high
    confidence: medium
    urgency: blocker
    remediation:
      class: config
      gate: review-required
    detector:
      collector: network
      logic: >
        proxy_auth_on("/") AND ws_reachable_without_auth("/ws")
    references:
      - type: discussion
        url: https://github.com/comfyanonymous/ComfyUI/discussions/2786

  - id: WEB-001
    title: Node browser JS calls an external host
    category: web-extension
    severity: high
    confidence: medium
    urgency: urgent
    remediation:
      class: manual
      gate: review-required
    detector:
      collector: node
      method: js-ast
      logic: >
        web_directory_js_calls(["fetch", "XMLHttpRequest", "WebSocket"])
        to non_self_origin (hardcoded IP, webhook, paste/anon-file host)
    references:
      - type: research
        url: https://labs.snyk.io/resources/hacking-comfyui-through-custom-nodes/

  - id: HOST-014
    title: Lateral-movement service reachable (Docker 2375, Redis)
    category: host
    severity: critical
    confidence: high
    urgency: blocker
    remediation:
      class: config
      gate: review-required
    detector:
      collector: [host, network]
      logic: >
        reachable(host, 2375) OR reachable_unauth(host, 6379)
      note: Exact escape/persistence vectors used by the 2026 GHOST/NadMesh botnets.
    references:
      - type: incident
        url: https://censys.com/blog/comfyui-servers-cryptomining-proxy-botnet/

  - id: DATA-002
    title: Outputs and uploads exposed without access control
    category: data
    severity: high
    confidence: high
    urgency: urgent
    decision_owner: human
    remediation:
      class: config
      gate: review-required
    detector:
      collector: [install, network]
      logic: >
        networked AND reachable_unauth("/view")
        AND reachable_unauth("/internal/files/output")
      note: Personal or sensitive images readable by anyone who can reach the instance (GDPR relevance).
    references:
      - type: source
        url: https://raw.githubusercontent.com/comfyanonymous/ComfyUI/master/server.py

  - id: IOC-001
    title: LD_PRELOAD rootkit present
    category: ioc
    severity: critical
    confidence: high
    urgency: blocker
    decision_owner: human
    remediation:
      class: manual
      gate: human-only
    detector:
      collector: host
      logic: >
        file_exists("/etc/ld.so.preload") OR
        env_contains("LD_PRELOAD", feed.rootkit_names)
      note: Used by the 2026 botnet to hide miner files/processes. Any hit = take the instance offline.
    references:
      - type: incident
        url: https://censys.com/blog/comfyui-servers-cryptomining-proxy-botnet/

  - id: OPS-004
    title: No backup or recovery for models, workflows, and config
    category: operations
    severity: medium
    confidence: high
    urgency: standard
    decision_owner: human
    remediation:
      class: manual
      gate: review-required
    detector:
      collector: [host]
      logic: no_backup_detected AND no_manager_snapshot
      note: A ComfyUI-Manager snapshot plus recorded core commit is the minimum clean-restore path after a compromise.
    references:
      - type: doc
        url: https://github.com/ltdrdata/ComfyUI-Manager
